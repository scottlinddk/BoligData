name: Backfill due-diligence checklist

# Re-answers noise, soil contamination and oil tank for every stored property from the registers,
# including listings that have left the crawl feed. Safe to re-run. Dry run unless `write` is ticked.
on:
  workflow_dispatch:
    inputs:
      write:
        description: "Persist the answers (off = dry run: queries the registers, writes nothing)"
        type: boolean
        default: false
      only_stale:
        description: "Skip properties whose registers already answered for real"
        type: boolean
        default: true
      limit:
        description: "Stop after this many properties (empty = all)"
        type: string
        default: ""

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: boligdata-crawl-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile and test the runner
        run: |
          pnpm --filter @boligdata/web exec tsc -p tsconfig.crawl.json
          pnpm --filter @boligdata/web exec vitest run server/lib/crawl server/lib/enrichment-sources
      - name: Read the existing production environment
        run: |
          umask 077
          npx vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Backfill
        run: |
          set -euo pipefail
          args=()
          if [ "$WRITE" = "true" ]; then args+=(--write); fi
          if [ "$ONLY_STALE" = "true" ]; then args+=(--only-stale); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          if [ -n "$RUNNER_SUPABASE_URL" ]; then export SUPABASE_URL="$RUNNER_SUPABASE_URL"; fi
          if [ -z "${SUPABASE_URL:-}" ] || [ "${SUPABASE_URL:-}" = "[SENSITIVE]" ]; then
            public_url="$(sed -n 's/^VITE_SUPABASE_URL=//p' apps/web/.env.production | tr -d "\"'\r" | head -n 1)"
            if [ -n "$public_url" ]; then export SUPABASE_URL="$public_url"; fi
          fi
          if [ -n "$RUNNER_SUPABASE_SERVICE_ROLE_KEY" ]; then export SUPABASE_SERVICE_ROLE_KEY="$RUNNER_SUPABASE_SERVICE_ROLE_KEY"; fi
          if [ -n "$RUNNER_DATAFORDELER_API_KEY" ]; then export DATAFORDELER_API_KEY="$RUNNER_DATAFORDELER_API_KEY"; fi
          node --env-file=.vercel/.env.production.local apps/web/.crawl-build/apps/web/server/lib/crawl/backfill-risk-flags-cli.js "${args[@]}"
        env:
          WRITE: ${{ inputs.write }}
          ONLY_STALE: ${{ inputs.only_stale }}
          LIMIT: ${{ inputs.limit }}
          RUNNER_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          RUNNER_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUNNER_DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}
      - name: Remove downloaded environment
        if: always()
        run: rm -f .vercel/.env.production.local
