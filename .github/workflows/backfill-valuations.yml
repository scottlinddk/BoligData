name: Backfill BFE and public valuations

on:
  workflow_dispatch:
    inputs:
      step:
        description: "discover and probe never write; dry-run reads and reports; write persists"
        type: choice
        default: discover
        options: [discover, probe, dry-run, write]
      limit:
        description: "Max properties to process (empty = all). Ignored by discover."
        type: string
        default: "20"
      rps:
        description: "Datafordeler requests per second (0.1 to 10)"
        type: string
        default: "2"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: boligdata-backfill-valuations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the valuation backfill
        run: |
          set -euo pipefail
          # The Supabase project URL is public (it ships in the browser bundle), so fall back to the committed one.
          if [ -z "${SUPABASE_URL:-}" ]; then
            SUPABASE_URL="$(sed -n 's/^VITE_SUPABASE_URL=//p' apps/web/.env.production | tr -d "\"'\r" | head -n 1)"
            export SUPABASE_URL
          fi
          args=()
          case "$STEP" in
            discover) args+=(--discover) ;;
            probe) args+=(--probe) ;;
            dry-run) ;;
            write) args+=(--write) ;;
          esac
          if [ "$STEP" != "discover" ]; then
            if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
            args+=(--rps "$RPS")
          fi
          node scripts/backfill-bfe-valuation.mjs "${args[@]}"
        env:
          STEP: ${{ inputs.step }}
          LIMIT: ${{ inputs.limit }}
          RPS: ${{ inputs.rps }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}
