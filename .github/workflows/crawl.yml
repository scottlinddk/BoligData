name: Property refresh (daily and weekly)

on:
  schedule:
    # 03:00 UTC daily — off-peak, well before the Danish business day starts.
    - cron: "0 3 * * *"
    # Monday 04:17 UTC: refresh older listings across the entire postcode scope.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "API crawl, weekly refresh, runner, verification, or original asking-price backfill"
        type: choice
        default: api
        options: [api, weekly, runner, verify, original-prices]
      dry_run:
        description: "Original prices only: inspect source evidence without writing"
        type: boolean
        default: true
      start_after_id:
        description: "Original prices only: resume after this property UUID; empty starts from the beginning"
        type: string
        default: ""
      start_offset:
        description: "API batch offset to resume (0 starts from the beginning)"
        type: number
        default: 0
      full_scan:
        description: "Runner only: up to 100 pages / 5000 listings per source, keeping configured area and sources"
        type: boolean
        default: false

jobs:
  crawl:
    if: github.event.schedule == '0 3 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'api' || inputs.mode == 'verify' || inputs.mode == 'original-prices'))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'original-prices' && 180 || 45 }}
    concurrency:
      group: boligdata-crawl-${{ inputs.mode == 'verify' && 'verification' || 'production' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Refresh in bounded API batches or verify production data
        run: bash scripts/crawl-api.sh
        env:
          RUN_MODE: ${{ inputs.mode }}
          RUN_START_OFFSET: ${{ inputs.start_offset }}
          RUN_DRY_RUN: ${{ inputs.dry_run }}
          RUN_START_AFTER_ID: ${{ inputs.start_after_id }}
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
  runner:
    if: github.event.schedule == '17 4 * * 1' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'runner' || inputs.mode == 'weekly'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: boligdata-crawl-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate and compile the ingest runner
        run: |
          pnpm --filter @boligdata/web exec tsc -p tsconfig.crawl.json
          pnpm --filter @boligdata/web exec vitest run server/lib/crawl server/lib/enrichment-sources
      - name: Read the existing production environment
        run: |
          umask 077
          npx vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Refresh live source observations
        run: |
          set -euo pipefail
          args=()
          if [ "$RUN_WEEKLY" = "true" ]; then args+=(--weekly); fi
          if [ "$RUN_FULL_SCAN" = "true" ]; then args+=(--full-scan); fi
          # Vercel does not export protected production values. Optional runner
          # secrets take precedence over the downloaded placeholders.
          if [ -n "$RUNNER_SUPABASE_URL" ]; then export SUPABASE_URL="$RUNNER_SUPABASE_URL"; fi
          if [ -n "$RUNNER_SUPABASE_SERVICE_ROLE_KEY" ]; then export SUPABASE_SERVICE_ROLE_KEY="$RUNNER_SUPABASE_SERVICE_ROLE_KEY"; fi
          if [ -n "$RUNNER_DATAFORDELER_API_KEY" ]; then export DATAFORDELER_API_KEY="$RUNNER_DATAFORDELER_API_KEY"; fi
          node --env-file=.vercel/.env.production.local apps/web/.crawl-build/apps/web/server/lib/crawl/run-cli.js "${args[@]}"
        env:
          RUN_FULL_SCAN: ${{ inputs.full_scan }}
          RUN_WEEKLY: ${{ github.event.schedule == '17 4 * * 1' || inputs.mode == 'weekly' }}
          RUNNER_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          RUNNER_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUNNER_DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}
      - name: Remove downloaded environment
        if: always()
        run: rm -f .vercel/.env.production.local
  original-price-refresh:
    name: Refresh original asking-price evidence
    needs: [crawl, runner]
    if: always() && github.event_name == 'schedule' && (needs.crawl.result == 'success' || needs.runner.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: boligdata-crawl-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Backfill original asking prices after the listing refresh
        run: bash scripts/crawl-api.sh
        env:
          RUN_MODE: original-prices
          RUN_DRY_RUN: "false"
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
