name: Daily property crawl

on:
  schedule:
    # 03:00 UTC daily — off-peak, well before the Danish business day starts.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "API crawl, full runner refresh (avoids function timeout), or read-only verification"
        type: choice
        default: api
        options: [api, runner, verify]
      full_scan:
        description: "Runner only: up to 100 pages / 5000 listings per source, keeping configured area and sources"
        type: boolean
        default: false

jobs:
  crawl:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'api'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/crawl and report results
        run: |
          set -uo pipefail

          headers=(-H "Authorization: Bearer ${CRON_SECRET}")
          if [ -n "${BYPASS_SECRET}" ]; then
            # Vercel Deployment Protection blocks unauthenticated requests with a
            # redirect to a login page instead of reaching the handler. This header
            # bypasses that when the project has protection enabled. Generate it in
            # the Vercel dashboard: Project Settings -> Deployment Protection ->
            # Protection Bypass for Automation.
            headers+=(-H "x-vercel-protection-bypass: ${BYPASS_SECRET}" -H "x-vercel-set-bypass-cookie: true")
          fi

          http_code=$(curl -sS -X POST "${VERCEL_URL}/api/crawl" "${headers[@]}" \
            -o response.json -w '%{http_code}')
          curl_status=$?

          if [ "$curl_status" -ne 0 ]; then
            echo "::error::curl failed to reach ${VERCEL_URL}/api/crawl (exit $curl_status)."
            exit 1
          fi

          echo "HTTP status: $http_code"

          if ! jq empty response.json 2>/dev/null; then
            echo "::error::Response body was not JSON — the request likely never reached the crawl handler."
            echo "This usually means Vercel Deployment Protection redirected the request to a login page."
            echo "Set the VERCEL_AUTOMATION_BYPASS_SECRET repo secret, or disable protection for this deployment."
            echo "--- raw response ---"
            cat response.json
            exit 1
          fi

          if ! jq -e '.reports' response.json > /dev/null 2>&1; then
            echo "::error::Response has no \"reports\" field (unexpected shape, or a 500 { error } crash response)."
            echo "--- raw response ---"
            cat response.json
            exit 1
          fi

          echo ""
          echo "== Crawl summary =="
          jq -r '
            .reports[] |
            "[\(.source)] found=\(.fetched) new=\(.created) updated=\(.upserted - .created) enriched=\(.enriched) skippedInvalid=\(.skippedInvalid) outOfArea=\(.skippedOutOfArea // 0) dbErrors=\(.dbErrors) ok=\(.ok)" +
            (if (.errors | length) > 0 then "\n  errors: " + (.errors | join("; ")) else "" end)
          ' response.json
          echo ""
          jq -r '
            "TOTAL: found=\([.reports[].fetched] | add) new=\([.reports[].created] | add) updated=\(([.reports[].upserted] | add) - ([.reports[].created] | add)) ok=\(.ok)"
          ' response.json

          ok=$(jq -r '.ok' response.json)
          if [ "$http_code" != "200" ] || [ "$ok" != "true" ]; then
            echo "::error::Crawl reported failure (HTTP $http_code, ok=$ok) — see per-source errors above."
            exit 1
          fi
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  runner:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'api'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate and compile the ingest runner
        run: |
          pnpm --filter @boligdata/web exec tsc -p tsconfig.crawl.json
          pnpm --filter @boligdata/web exec vitest run server/lib/crawl server/lib/enrichment-sources
      - name: Read the existing production environment
        run: |
          umask 077
          npx vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Refresh live source observations or verify counts
        run: |
          set -euo pipefail
          args=()
          if [ "$RUN_MODE" = "verify" ]; then args+=(--verify-only); fi
          if [ "$RUN_FULL_SCAN" = "true" ]; then args+=(--full-scan); fi
          node --env-file=.vercel/.env.production.local apps/web/.crawl-build/apps/web/server/lib/crawl/run-cli.js "${args[@]}"
        env:
          RUN_MODE: ${{ inputs.mode }}
          RUN_FULL_SCAN: ${{ inputs.full_scan }}
      - name: Remove downloaded environment
        if: always()
        run: rm -f .vercel/.env.production.local
