name: Fetch new listings

on:
  # Scheduled runs are disabled. Boligsiden's data policy
  # (https://www.boligsiden.dk/information/datapolitik) prohibits scraping and
  # crawling without a prior written agreement. Do not re-enable without one.
  workflow_dispatch:

jobs:
  recent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Shares the production group so it never writes alongside the daily or weekly refresh.
    concurrency:
      group: boligdata-crawl-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile the ingest runner
        run: pnpm --filter @boligdata/web exec tsc -p tsconfig.crawl.json
      - name: Read the existing production environment
        run: |
          umask 077
          npx vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Ingest the newest Boligsiden listings
        run: |
          set -euo pipefail
          if [ -n "$RUNNER_SUPABASE_URL" ]; then export SUPABASE_URL="$RUNNER_SUPABASE_URL"; fi
          if [ -z "${SUPABASE_URL:-}" ] || [ "${SUPABASE_URL:-}" = "[SENSITIVE]" ]; then
            public_url="$(sed -n 's/^VITE_SUPABASE_URL=//p' apps/web/.env.production | tr -d "\"'\r" | head -n 1)"
            if [ -n "$public_url" ]; then export SUPABASE_URL="$public_url"; fi
          fi
          if [ -n "$RUNNER_SUPABASE_SERVICE_ROLE_KEY" ]; then export SUPABASE_SERVICE_ROLE_KEY="$RUNNER_SUPABASE_SERVICE_ROLE_KEY"; fi
          if [ -n "$RUNNER_DATAFORDELER_API_KEY" ]; then export DATAFORDELER_API_KEY="$RUNNER_DATAFORDELER_API_KEY"; fi
          node --env-file=.vercel/.env.production.local apps/web/.crawl-build/apps/web/server/lib/crawl/run-cli.js --recent
        env:
          RUNNER_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          RUNNER_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUNNER_DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}
      - name: Remove downloaded environment
        if: always()
        run: rm -f .vercel/.env.production.local
