name: Discover Datafordeler schema and files

# Read-only. Prints which GraphQL types, fields and bulk files Datafordeler exposes for
# BBR, VUR, DAR and EJF, using the existing DATAFORDELER_API_KEY secret. It also downloads a few
# small zone-0 files to print their header and first rows. Writes nothing to any database and
# uploads no artifacts, so the log is the only output.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover
        run: node scripts/discover-datafordeler.mjs
        env:
          DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}
